<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Budget HP — monthly budget as hit points</title>
<meta name="description" content="Your monthly budget is a life bar. Spend under it and bank XP when the month closes; overspend and lose HP and your streak.">
<meta name="theme-color" content="#14150F">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/src/css/main.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<noscript><p class="noscript"><b>Budget HP needs JavaScript.</b> Enable it to see your budget, purchases, and streak.</p></noscript>

<!-- include:header -->

<main id="main" tabindex="-1">
  <section class="board" aria-labelledby="today-h">

    <div class="hp">
      <div class="hp-head">
        <h1 id="today-h" tabindex="-1">HP this month</h1>
        <span class="hp-date" id="hp-date"></span>
      </div>
      <p class="hp-num" id="hp-num" aria-live="polite" aria-atomic="true"><small>Rp</small><span>—</span></p>
      <p class="hp-math" id="hp-math">Set this month’s budget to start.</p>

      <div class="bar" id="bar" role="img" aria-label="Monthly budget bar">
        <div class="bar-fill" id="bar-fill"></div>
        <div class="bar-edge" id="bar-edge"></div>
      </div>
      <div class="bar-scale">
        <span>0</span>
        <span id="bar-spent">no spending yet</span>
        <span id="bar-budget"></span>
      </div>

      <p class="hp-zone" id="hp-zone" aria-hidden="true"></p>
      <div class="ramp" id="ramp" aria-hidden="true"></div>
      <p class="hp-note" id="hp-note"></p>
    </div>

    <div class="board-cta">
      <p class="board-today" id="board-today"></p>
      <a class="btn primary board-add" id="board-add" href="add.html">Add purchase</a>
    </div>

    <h2 class="lines-h">Today’s lines <span id="lines-count"></span></h2>
    <ul class="lines" id="today-lines"></ul>

    <section class="insights" id="insights" aria-labelledby="insights-h">
      <h2 id="insights-h">This month <span id="insights-month"></span></h2>
      <p class="insights-note" id="insights-note"></p>
      <p class="insights-empty" id="insights-empty" hidden></p>

      <div class="charts" id="charts">
        <figure class="chart chart-line">
          <figcaption>
            <span class="chart-title">Daily spend</span>
            <span class="chart-key">
              <span class="k-spend">spend</span>
              <span class="k-allow" id="line-allow">daily allowance</span>
              <span class="k-over">over allowance</span>
            </span>
          </figcaption>
          <div class="chart-body" id="chart-line"></div>
        </figure>

        <div class="chart-pair">
          <figure class="chart chart-donut">
            <figcaption><span class="chart-title">By category</span></figcaption>
            <div class="donut-wrap">
              <div class="chart-body" id="chart-donut"></div>
              <p class="donut-center" id="donut-center" aria-hidden="true"></p>
            </div>
            <ul class="donut-legend" id="donut-legend" aria-label="Spending by category"></ul>
          </figure>

          <figure class="chart chart-cal">
            <figcaption><span class="chart-title">Every day</span></figcaption>
            <div class="chart-body cal-wrap" id="chart-calendar"></div>
          </figure>
        </div>
      </div>
    </section>

    <div class="block" id="budget-block">
      <h2 id="budget">Monthly budget</h2>
      <form class="budget-form" id="budget-form" autocomplete="off">
        <label class="field field-amount">
          <span>Budget for <em id="budget-month">this month</em></span>
          <span class="field-wrap"><i>Rp</i><input name="budget" inputmode="numeric" pattern="[0-9.]*" placeholder="e.g. 3.100.000" aria-describedby="budget-error" required></span>
        </label>
        <button class="btn" type="submit">Save budget</button>
      </form>
      <p class="entry-error" id="budget-error" role="alert"></p>
      <p class="fine" id="budget-meta"></p>
    </div>

    <div class="block">
      <h2>Your data</h2>
      <div class="data-actions">
        <button class="btn quiet" type="button" id="export-btn">Export JSON</button>
        <button class="btn quiet" type="button" id="import-btn">Import JSON</button>
        <input type="file" id="import-file" accept="application/json,.json" hidden>
      </div>
      <p class="fine" id="data-note">Everything stays in this browser. Export is the only backup.</p>
    </div>

  </section>

  <aside class="rail" aria-labelledby="week-h">
    <h2 class="week-title" id="week-h">Last 7 days</h2>
    <!-- include:week-rail -->
  </aside>
</main>

<!-- include:footer -->

<p class="sr-only" id="status" aria-live="polite"></p>
<script type="module" src="/src/js/pages/board.js"></script>
</body>
</html>
